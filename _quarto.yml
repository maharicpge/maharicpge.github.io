header-includes: |
  <script data-goatcounter="https://maharicpge.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function label(n) { return ' (' + n + ' téléchargement' + (n > 1 ? 's' : '') + ')'; }
      document.querySelectorAll('table a[href$=".pdf"]').forEach(function (a) {
        var url  = a.getAttribute('href');
        var name = url.split('/').pop().replace(/\.pdf$/i, '');
        var path = '/dl/' + name;
        a.target = '_blank';
        a.rel = 'noopener';
        var span = document.createElement('span');
        span.className = 'dl-count';
        span.textContent = ' (…)';
        span.dataset.n = '0';
        a.insertAdjacentElement('afterend', span);
        fetch('https://maharicpge.goatcounter.com/counter/' + encodeURIComponent(path) + '.json?ts=' + Date.now())
          .then(function (r) { if (!r.ok) throw 0; return r.json(); })
          .then(function (d) { span.dataset.n = String(d.count); span.textContent = label(d.count); })
          .catch(function () { span.textContent = label(0); });
        a.addEventListener('click', function () {
          var n = parseInt(span.dataset.n || '0', 10) + 1;
          span.dataset.n = String(n);
          span.textContent = label(n);
          if (window.goatcounter && window.goatcounter.count) {
            window.goatcounter.count({ path: path, title: 'Téléchargement : ' + name });
          }
        });
      });
    });
  </script>
format:
  html:
    theme: [minty, custom.scss]
    css: styles.css
    toc: true


